name: Build with Python

on:
  push:
    tags: [ "v*" ]

env:
  BLENDER_VERSION: "4.2.9LTS"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Run compile script
        run: python compile.py

      - name: Copy installation files
        run: |
          cp install.bat releases/
          cp requirements.txt releases/

      - name: Create release ZIP
        run: |
          cd releases
          7z a -r "robotcontrol-toolbox-blender${{ env.BLENDER_VERSION }}-${{ github.ref_name }}.zip" .
          cd ..

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Versión ${{ github.ref_name }} de RobotControl Editor Toolbox Addon"
          draft: false
          prerelease: false
        id: create_release

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./releases/robotcontrol-toolbox-blender${{ env.BLENDER_VERSION }}-${{ github.ref_name }}.zip
          asset_name: robotcontrol-toolbox-blender${{ env.BLENDER_VERSION }}-${{ github.ref_name }}.zip
          asset_content_type: application/zip
